<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ZAM Mobile</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
        padding: 16px;
        padding-left: calc(16px + env(safe-area-inset-left));
        padding-right: calc(16px + env(safe-area-inset-right));
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }
      h1 { font-size: 1.35rem; margin: 0 0 2px; }
      h2 { font-size: 1.05rem; margin: 0; }
      .subtitle { margin: 0 0 18px; opacity: 0.7; font-size: 0.85rem; }
      .card {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      form { display: grid; gap: 9px; }
      label { display: grid; gap: 5px; font-size: 0.85rem; }
      input, button {
        font: inherit;
        padding: 11px 14px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 9px;
        background: transparent;
        color: inherit;
      }
      button { min-height: 44px; }
      button.primary { font-weight: 650; width: 100%; }
      button:disabled { opacity: 0.55; }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
      .status-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        margin-bottom: 12px;
        font-size: 0.9rem;
      }
      .status-grid span { opacity: 0.7; }
      #connection.offline { color: #b45309; }
      #pairing-status, #status { min-height: 1.3em; font-size: 0.9rem; }
      .error { color: #c2410c; }
      details { margin-top: 14px; }
      details summary { cursor: pointer; font-weight: 600; }
      details form { margin-top: 12px; }
      #summary { font-size: 0.9rem; margin: 12px 0; opacity: 0.85; }
      ol#queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      #queue li {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 10px;
        padding: 10px 12px;
      }
      #queue .title { font-weight: 600; }
      #queue .meta { font-size: 0.8rem; opacity: 0.7; margin-top: 2px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>ZAM Mobile</h1>
      <p class="subtitle">Aktive Wiederholung mit derselben Lernbibliothek</p>

      <section id="pairing-view" hidden>
        <div class="card">
          <h2>Mit ZAM Desktop koppeln</h2>
          <p>In ZAM Desktop unter Einstellungen → Mobile Begleit-App einen QR-Code anzeigen.</p>
          <button id="scan-pairing-code" class="primary" type="button">QR-Code scannen</button>
          <button id="camera-settings" type="button" hidden>App-Einstellungen öffnen</button>
          <p id="pairing-status" aria-live="polite"></p>
          <button id="cancel-pairing" type="button" hidden>Abbrechen</button>

          <details>
            <summary>Manuelle Eingabe</summary>
            <form id="manual-pairing-form">
              <label>
                Server-Datenbank
                <input id="manual-sync-url" type="url" placeholder="libsql://…" autocomplete="off" required />
              </label>
              <label>
                Datenbank-Token
                <input id="manual-auth-token" type="password" autocomplete="off" required />
              </label>
              <label>
                Lernenden-ID
                <input id="manual-user-id" type="text" maxlength="128" autocomplete="off" required />
              </label>
              <button class="primary" type="submit">Manuell koppeln</button>
            </form>
          </details>
        </div>
      </section>

      <section id="app-view" hidden>
        <div class="card">
          <div class="status-grid">
            <span>Lernender</span><strong id="learner">—</strong>
            <span>Status</span><strong id="connection">—</strong>
          </div>
          <div class="buttons">
            <button id="resync" type="button">Jetzt synchronisieren</button>
            <button id="repair" type="button">Neu koppeln</button>
          </div>
          <p id="status" aria-live="polite"></p>
        </div>
        <section id="summary"></section>
        <ol id="queue"></ol>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
