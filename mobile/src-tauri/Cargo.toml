[package]
name = "zam-mobile"
version = "0.0.1"
description = "ZAM Android companion shell (Phase 0 spike)"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "zam_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
libsql = "0.9"
