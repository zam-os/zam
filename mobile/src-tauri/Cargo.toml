[package]
name = "zam-mobile"
version = "0.24.1"
description = "ZAM mobile companion app (Android + iOS)"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "zam_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Exposes tauri_utils::build::link_apple_library, which is behind the build-2
# feature and backed by swift-rs. `build-2` (not `build`) is what tauri-build
# already enables, so the features unify instead of pulling a second HTML stack.
# swift-rs is itself macOS-host-gated inside tauri-utils, so this stays portable.
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
libsql = "0.9"

# Packaged WebPKI roots for the libsql remote connector. Needed on both mobile
# platforms; Cargo target specs cannot see Tauri's injected `mobile` cfg, so the
# `any(...)` form is spelled out here while the Rust sources use `cfg(mobile)`.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
hyper-rustls = { version = "0.25", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
tauri-plugin-barcode-scanner = "2"

# Android-only: the APK update channel and the AICore on-device evaluator.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
