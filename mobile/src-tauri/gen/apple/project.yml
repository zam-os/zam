name: zam-mobile
options:
  bundleIdPrefix: org.zamos.zam
  deploymentTarget:
    # Kept in sync with bundle.iOS.minimumSystemVersion in tauri.conf.json.
    # The iPad (A16) reference device cannot run below iPadOS 18 anyway; 17.0
    # exists as headroom for the iPhone 14 compatibility target, and because a
    # school-managed device may have OS updates deferred by MDM.
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: ZAM Mobile
      PRODUCT_BUNDLE_IDENTIFIER: org.zamos.zam
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  zam-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: zam-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: zam-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Stamped from package.json by the release workflow; kept in step here
        # so a local build is not mislabelled either.
        CFBundleShortVersionString: 0.24.1
        CFBundleVersion: "0.24.1"
        # QR pairing is the entire first-run path (FR-0). iOS terminates the
        # app on first camera access if this key is absent, so it is required,
        # not cosmetic. German-first, matching the app UI.
        NSCameraUsageDescription: >-
          ZAM scannt den QR-Code aus ZAM Desktop, um dieses Gerät einmalig mit
          deiner Lernkartei zu verbinden.
        # Voice review (ADR 2026-07-31). Both keys are mandatory, not
        # advisory: iOS terminates the process rather than prompting when a
        # usage description is missing. Recognition is pinned on-device, so the
        # wording promises exactly that and nothing more.
        NSMicrophoneUsageDescription: >-
          ZAM nutzt das Mikrofon nur im Sprachmodus, damit du deine Karten laut
          beantworten kannst.
        NSSpeechRecognitionUsageDescription: >-
          ZAM wandelt deine gesprochene Antwort auf diesem Gerät in Text um, um
          sie mit der erwarteten Antwort zu vergleichen.
        # ZAM only uses HTTPS/TLS via the OS, which is exempt. Declaring this
        # up front stops TestFlight asking for export compliance on every build.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: zam-mobile_iOS/zam-mobile_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        # Manuelles Signieren, bewusst nur für echte Geräte (`sdk=iphoneos*`).
        # Ohne diese Angaben scheitert der Gerätebau mit "requires a
        # provisioning profile": die Umgebungsvariablen IOS_CERTIFICATE /
        # IOS_MOBILE_PROVISION installieren zwar Zertifikat und Profil und
        # schalten auf manuelles Signieren um, sagen Xcode aber nicht, welches
        # Profil es nehmen soll.
        # Der Alternativweg wäre automatisches Signieren über APPLE_API_KEY —
        # der bräuchte jedoch einen Admin-Key in den CI-Secrets, während für
        # den Upload sonst App-Manager genügt.
        # Simulatorbauten (CI-Job `ios`) bleiben unberührt und signaturfrei.
        # DEVELOPMENT_TEAM muss hier stehen, auch wenn Tauri den Wert aus
        # APPLE_DEVELOPMENT_TEAM setzt: Tauri fügt den Schlüssel sonst per
        # Texteinfügung *hinter* die schließende Klammer von buildSettings ein,
        # wo Xcode ihn ignoriert ("requires a development team"). Existiert der
        # Schlüssel bereits, überschreibt Tauri sauber nur den Wert — so wie
        # beim PROVISIONING_PROFILE_SPECIFIER darunter. Der Wert hier ist also
        # nur der Vorgabewert; APPLE_DEVELOPMENT_TEAM sticht ihn.
        DEVELOPMENT_TEAM: 3KZ69XA25D
        CODE_SIGN_STYLE[sdk=iphoneos*]: Manual
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: ZAM Mobile App Store
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a