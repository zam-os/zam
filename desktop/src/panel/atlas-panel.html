<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZAM Knowledge Atlas</title>
    <style>
      /* The panel shows the Studio's atlas view (desktop/src/atlas/): the
         design tokens and the atlas rules come from tokens.css and
         atlas/atlas.css through atlas-panel.ts. Here only the page and the
         few shared controls the view uses. No web fonts: the tokens fall
         back to the system's. */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      button,
      input {
        font-family: inherit;
      }
      body {
        font-family: var(--font-ui);
        font-size: var(--fs-md);
        background: var(--color-ground);
        color: var(--color-ink);
        padding: var(--space-3);
        -webkit-font-smoothing: antialiased;
      }
      #atlas-root {
        height: min(640px, calc(100vh - 72px));
        min-height: 420px;
      }
      .btn {
        font-weight: 700;
        font-size: var(--fs-md);
        padding: 10px 20px;
        border-radius: var(--radius-control);
        border: 1px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
      }
      .btn:focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 2px;
      }
      .btn-sm {
        padding: 6px 14px;
        font-size: var(--fs-sm);
      }
      .primary-btn {
        background: var(--color-accent);
        border-color: var(--color-accent);
        color: var(--color-on-accent);
      }
      .primary-btn:disabled {
        background: var(--color-surface-2);
        border-color: var(--color-line);
        color: var(--color-muted);
        cursor: not-allowed;
      }
      .secondary-btn {
        background: var(--color-surface);
        border: 1px solid var(--color-line-strong);
        color: var(--color-ink);
      }
      .secondary-btn:hover:not(:disabled) {
        border-color: var(--color-accent);
        color: var(--color-accent-ink);
      }
      .dots-bounce {
        display: flex;
        gap: 8px;
      }
      .bounce-dot {
        width: 12px;
        height: 12px;
        background: var(--color-accent);
        border-radius: 50%;
        animation: bounceAnimation 1.4s infinite ease-in-out both;
      }
      .bounce-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .bounce-dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes bounceAnimation {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
      .loader-message {
        font-size: var(--fs-base);
        font-weight: 500;
        color: var(--color-ink);
      }
      .study-busy-progress {
        width: min(280px, 70%);
        height: 4px;
        margin-top: 6px;
        border-radius: var(--radius-pill);
        overflow: hidden;
        background: var(--color-surface-2);
      }
      .study-busy-progress span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--color-accent);
        animation: atlasPanelSweep 1.1s ease-in-out infinite;
      }
      @keyframes atlasPanelSweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bounce-dot,
        .study-busy-progress span {
          animation-duration: 3s;
        }
      }
      .zam-connection-notice {
        margin-bottom: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--color-danger-line);
        border-radius: var(--radius-control);
        background: var(--color-danger-soft);
        color: var(--color-ink);
        font-size: var(--fs-sm);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="zam-contextbar-root"></div>
    <div class="zam-connection-notice" id="zam-connection-notice" hidden></div>
    <main id="atlas-root" class="atlas-root" aria-label="ZAM Knowledge Atlas"></main>
    <script type="module" src="./atlas-panel.ts"></script>
  </body>
</html>
