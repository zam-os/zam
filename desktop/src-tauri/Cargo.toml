[package]
name = "zam-app"
version = "0.27.1"
description = "ZAM Active-Recall Studio"
authors = ["ZAM Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zam_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Voice mode's device tier (ADR 2026-07-31). Apple speech is bound directly from
# Rust rather than via a Swift package so the notarized macOS build stays a pure
# Rust build; iOS keeps its own Swift plugin.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSLocale", "NSRunLoop", "NSString", "NSURL", "NSValue"] }
objc2-avf-audio = { version = "0.3", features = ["AVAudioRecorder", "AVSpeechSynthesis"] }
objc2-speech = { version = "0.3", features = ["SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Win32_System_Registry is needed to read the speech privacy-policy flag:
# dictation refuses to run without it and only says so at recognition time, so
# there is no WinRT API to ask up front (see voice.rs::speech_privacy_accepted).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Media_Core", "Media_Playback", "Media_SpeechRecognition", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_Registry"] }
