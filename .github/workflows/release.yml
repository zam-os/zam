name: 'Publish ZAM Release'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: 'Publish zam-core to npm'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Required for npm publish --provenance to mint a signed attestation.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Trusted publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Guard tag/package version match
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # Publishes via npm Trusted Publishing (OIDC). Configure on npmjs.com:
      # Package zam-core → Settings → Trusted publishing → GitHub Actions
      #   org/user: zam-os, repo: zam, workflow: release.yml, action: npm publish
      - name: Publish to npm
        run: npm publish --provenance --access public

  publish-tauri:
    permissions:
      contents: write
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
    strategy:
      fail-fast: false
      matrix:
        # macOS (aarch64) ships updater artifacts signed with the same Tauri
        # updater key already used for Linux/Windows — that is all the in-app
        # update button needs. The app is NOT Apple-notarized, so manual
        # first-time downloads still hit Gatekeeper (right-click -> Open);
        # in-app auto-updates are unaffected. Add macos-15-intel
        # (x86_64-apple-darwin) here too if Intel Macs need first-class support.
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            # AppImage's linuxdeploy currently fails when it scans the bundled
            # native libsql module. Keep libsql support and ship deb/rpm until
            # upstream AppImage packaging can handle that resource.
            args: '--target x86_64-unknown-linux-gnu --bundles deb,rpm'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
          - platform: 'macos-15'
            target: 'aarch64-apple-darwin'
            # Build only the .app (plus the updater .app.tar.gz + .sig that
            # createUpdaterArtifacts emits). Skip the dmg — it adds a flaky
            # bundling step we do not need for auto-update.
            args: '--target aarch64-apple-darwin --bundles app'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (Root Workspace)
        run: npm ci

      - name: Build ZAM CLI Bridge (Root Workspace)
        run: npm run build

      - name: Prepare Self-Contained Desktop Bridge
        run: npm run desktop:prepare -- --bundle-node

      - name: Build Native Observer Sidecar
        run: cargo build --manifest-path observer/Cargo.toml --release --target ${{ matrix.target }}

      - name: Prepare Observer Sidecar
        run: npm run observer:prepare -- --target ${{ matrix.target }}

      - name: Verify locked Rust dependency graph
        working-directory: desktop/src-tauri
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Smoke-test first launch (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          export HOME="$RUNNER_TEMP/zam-first-run"
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge desktop-bootstrap
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge check-due

      - name: Smoke-test first launch (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "zam-first-run"
          & ".\desktop\src-tauri\resources\zam-cli\runtime\node.exe" ".\desktop\src-tauri\resources\zam-cli\dist\cli\index.js" bridge desktop-bootstrap
          & ".\desktop\src-tauri\resources\zam-cli\runtime\node.exe" ".\desktop\src-tauri\resources\zam-cli\dist\cli\index.js" bridge check-due

      - name: Smoke-test first launch (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOME="$RUNNER_TEMP/zam-first-run"
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge desktop-bootstrap
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge check-due

      - name: Install dependencies (Desktop Application)
        working-directory: desktop
        run: npm ci

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
            });
            core.setOutput('body', notes.body);

      - name: Build Tauri Desktop Application & Publish Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required because tauri.conf.json sets createUpdaterArtifacts: true.
          # Without a private key the bundler aborts the build. Store the
          # contents of desktop/src-tauri/zam-signing.key as a repo secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ZAM Desktop ${{ github.ref_name }}'
          releaseBody: |
            ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          projectPath: './desktop'
          args: ${{ matrix.args }}

      # tauri-action uploads the updater artifacts (ZAM.app.tar.gz + .sig) and
      # adds the darwin-aarch64 entry to latest.json. This extra step also ships
      # the friendly hand-installable .app.zip we have historically attached, so
      # manual downloaders keep the same asset name they had before.
      - name: Upload macOS .app zip for manual download
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="ZAM_${GITHUB_REF_NAME#v}_aarch64_macOS.app.zip"
          ditto -c -k --sequesterRsrc --keepParent ZAM.app "$ZIP"
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber

  publish-vscode-extension:
    name: 'Upload ZAM Companion VSIX'
    needs: publish-tauri
    if: ${{ always() && needs.publish-tauri.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build VS Code Companion
        run: npm run build:vscode-extension

      - name: Guard tag/package version match
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Upload VSIX to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/vscode-extension/ZAM_Companion_${GITHUB_REF_NAME#v}.vsix" --clobber

  # Field-test Android companion: signed APK + mobile-latest.json for in-app
  # sideload updates (Tauri's updater plugin does not support Android).
  publish-android:
    name: 'Upload ZAM Mobile APK'
    needs: publish-tauri
    if: ${{ always() && needs.publish-tauri.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Guard tag/package version match
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Install root + mobile dependencies
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing — release APK will use the debug keystore (field-test only)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zam-android.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zam-android.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build Android release APK (aarch64)
        working-directory: mobile
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: npm run android:build -- --target aarch64

      - name: Package APK + mobile-latest.json and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${PKG_VERSION}"
          # Prefer universal release APK; fall back to aarch64-only output paths.
          SRC="$(find mobile/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "::error::No APK produced by android:build"
            find mobile/src-tauri/gen/android/app/build/outputs -type f | head -50
            exit 1
          fi
          APK="ZAM_Mobile_${VERSION}_aarch64.apk"
          cp "$SRC" "$APK"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK}"
          # Tauri derives the installed APK's versionCode as
          # major*1000000 + minor*1000 + patch (0.16.1 → 16001); the manifest
          # must use the same scheme or the in-app update check never fires.
          # Mirrors versionCodeFromSemver in mobile/src/update.ts.
          VERSION_CODE="$(node -e "
            const [a,b,c]=('${VERSION}'.replace(/^v/,'').split('.').map(Number));
            console.log((a||0)*1000000+(b||0)*1000+(c||0));
          ")"
          node -e "
            const fs=require('fs');
            fs.writeFileSync('mobile-latest.json', JSON.stringify({
              version: '${VERSION}',
              versionCode: ${VERSION_CODE},
              url: '${APK_URL}',
              notes: 'ZAM Mobile ${VERSION} (aarch64 sideload)',
            }, null, 2) + '\n');
          "
          gh release upload "$GITHUB_REF_NAME" "$APK" mobile-latest.json --clobber
          echo "Uploaded $APK and mobile-latest.json (versionCode=$VERSION_CODE)"
