name: 'Publish ZAM Desktop Release'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (Root Workspace)
        run: npm ci

      - name: Build ZAM CLI Bridge (Root Workspace)
        run: npm run build

      - name: Install dependencies (Desktop Application)
        run: |
          cd desktop
          npm ci

      - name: Build Tauri Desktop Application & Publish Draft Release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'ZAM Desktop v__VERSION__'
          releaseBody: 'Welcome to the ZAM Active-Recall Studio desktop release! Extract/install the binary for your platform below. Keep learning!'
          releaseDraft: true
          prerelease: false
          projectPath: './desktop'
          args: ${{ matrix.args }}
