name: 'Publish ZAM Desktop Release'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
    strategy:
      fail-fast: false
      matrix:
        # macOS is intentionally excluded from the first release: it requires
        # separate Apple signing/notarization secrets that are not set up yet.
        # Re-add the macos-15-intel (x86_64-apple-darwin) and macos-15
        # (aarch64-apple-darwin) targets once those secrets exist.
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            # AppImage's linuxdeploy currently fails when it scans the bundled
            # native libsql module. Keep libsql support and ship deb/rpm until
            # upstream AppImage packaging can handle that resource.
            args: '--target x86_64-unknown-linux-gnu --bundles deb,rpm'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (Root Workspace)
        run: npm ci

      - name: Build ZAM CLI Bridge (Root Workspace)
        run: npm run build

      - name: Prepare Self-Contained Desktop Bridge
        run: npm run desktop:prepare -- --bundle-node

      - name: Verify locked Rust dependency graph
        working-directory: desktop/src-tauri
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Smoke-test first launch (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          export HOME="$RUNNER_TEMP/zam-first-run"
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge desktop-bootstrap
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge check-due

      - name: Smoke-test first launch (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "zam-first-run"
          & ".\desktop\src-tauri\resources\zam-cli\runtime\node.exe" ".\desktop\src-tauri\resources\zam-cli\dist\cli\index.js" bridge desktop-bootstrap
          & ".\desktop\src-tauri\resources\zam-cli\runtime\node.exe" ".\desktop\src-tauri\resources\zam-cli\dist\cli\index.js" bridge check-due

      - name: Install dependencies (Desktop Application)
        working-directory: desktop
        run: npm ci

      - name: Build Tauri Desktop Application & Publish Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required because tauri.conf.json sets createUpdaterArtifacts: true.
          # Without a private key the bundler aborts the build. Store the
          # contents of desktop/src-tauri/zam-signing.key as a repo secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ZAM Desktop ${{ github.ref_name }}'
          releaseBody: 'Install the ZAM Active-Recall Studio package for your platform. The CLI bridge and Node runtime are included.'
          releaseDraft: true
          prerelease: false
          projectPath: './desktop'
          args: ${{ matrix.args }}
