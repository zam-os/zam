name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zam
          POSTGRES_PASSWORD: zam_password
          POSTGRES_DB: zam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check project
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Smoke-test built CLI
        run: node dist/cli/index.js --version

      - name: Run tests
        env:
          POSTGRES_URL: postgres://zam:zam_password@localhost:5432/zam_test
        run: npm run test

      - name: Test observer core
        run: npm run observer:test

  desktop:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install root dependencies
        run: npm ci

      - name: Build CLI bridge
        run: npm run build

      - name: Prepare bundled desktop bridge
        run: npm run desktop:prepare -- --bundle-node

      - name: Build and prepare observer sidecar
        run: |
          cargo build --manifest-path observer/Cargo.toml --release --target x86_64-unknown-linux-gnu
          npm run observer:prepare -- --target x86_64-unknown-linux-gnu

      - name: Smoke-test bundled desktop bridge on a clean machine
        run: |
          export HOME="$RUNNER_TEMP/zam-first-run"
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge desktop-bootstrap
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge check-due

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build

      - name: Check Tauri backend
        working-directory: desktop/src-tauri
        run: cargo check --locked

  mobile:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build mobile frontend
        working-directory: mobile
        run: npm run build

      - name: Test mobile Tauri backend
        working-directory: mobile/src-tauri
        run: cargo test --locked

      - name: Check Android Tauri backend
        working-directory: mobile/src-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo check --locked --target aarch64-linux-android

  windows-x64-observer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test native x64 observer
        run: cargo test --manifest-path observer/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build native x64 observer
        run: cargo build --manifest-path observer/Cargo.toml --release --target x86_64-pc-windows-msvc

  windows-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Verify native ARM64 runtime
        shell: pwsh
        run: |
          if (node -p "process.arch" | Select-String -NotMatch '^arm64$') {
            throw "Expected an ARM64 Node.js runtime"
          }

      - name: Install dependencies
        run: npm ci

      # One command per step: in a multi-line pwsh `run` block only the LAST
      # command's exit code decides the step result, so a red `npm test` used
      # to ship green as long as the cargo build after it passed (issue #190).
      - name: Type-check project
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test native ARM64 observer
        run: cargo test --manifest-path observer/Cargo.toml --target aarch64-pc-windows-msvc

      - name: Build native ARM64 observer
        run: cargo build --manifest-path observer/Cargo.toml --release --target aarch64-pc-windows-msvc

      # bash, not pwsh: `-e` makes any failing CLI call fail the step, so the
      # three-command smoke sequence cannot mask an early failure either.
      - name: Smoke-test local database
        shell: bash
        run: |
          node dist/cli/index.js setup --skip-claude-md --skip-agents-md
          node dist/cli/index.js whoami --set ci
          node dist/cli/index.js stats
