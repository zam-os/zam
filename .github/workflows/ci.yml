name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check project
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Smoke-test built CLI
        run: node dist/cli/index.js --version

      - name: Run tests
        run: npm run test

      - name: Test observer core
        run: npm run observer:test

  desktop:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install root dependencies
        run: npm ci

      - name: Build CLI bridge
        run: npm run build

      - name: Prepare bundled desktop bridge
        run: npm run desktop:prepare -- --bundle-node

      - name: Build and prepare observer sidecar
        run: |
          cargo build --manifest-path observer/Cargo.toml --release --target x86_64-unknown-linux-gnu
          npm run observer:prepare -- --target x86_64-unknown-linux-gnu

      - name: Smoke-test bundled desktop bridge on a clean machine
        run: |
          export HOME="$RUNNER_TEMP/zam-first-run"
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge desktop-bootstrap
          desktop/src-tauri/resources/zam-cli/runtime/node desktop/src-tauri/resources/zam-cli/dist/cli/index.js bridge check-due

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build

      - name: Check Tauri backend
        working-directory: desktop/src-tauri
        run: cargo check --locked

  windows-x64-observer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test native x64 observer
        run: cargo test --manifest-path observer/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build native x64 observer
        run: cargo build --manifest-path observer/Cargo.toml --release --target x86_64-pc-windows-msvc

  windows-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Verify native ARM64 runtime
        shell: pwsh
        run: |
          if (node -p "process.arch" | Select-String -NotMatch '^arm64$') {
            throw "Expected an ARM64 Node.js runtime"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run typecheck
          npm run build
          npm test
          cargo test --manifest-path observer/Cargo.toml --target aarch64-pc-windows-msvc
          cargo build --manifest-path observer/Cargo.toml --release --target aarch64-pc-windows-msvc

      - name: Smoke-test local database
        run: |
          node dist/cli/index.js setup --skip-claude-md --skip-agents-md
          node dist/cli/index.js whoami --set ci
          node dist/cli/index.js stats
