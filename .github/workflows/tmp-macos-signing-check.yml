# TEMPORARY — delete before merging.
# Exercises the keychain import from release.yml on a real runner, so the first
# real run of it is not a release. Guarded to this one branch.
name: tmp-macos-signing-check

on: pull_request

jobs:
  check:
    if: github.head_ref == 'feat/macos-notarization'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare macOS signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] \
            || [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "::error::macOS signing secrets missing. Set APPLE_CERTIFICATE," \
              "APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY —" \
              "see docs/adr/2026-07-27-macos-notarization.md"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/zam-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE="$RUNNER_TEMP/developer_id.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf %s "$APPLE_CERTIFICATE" | base64 -d > "$CERTIFICATE"
          security import "$CERTIFICATE" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERTIFICATE"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          EXISTING="$(security list-keychain -d user | tr -d '"' | tr '\n' ' ')"
          # shellcheck disable=SC2086
          security list-keychain -d user -s "$KEYCHAIN" $EXISTING

          security find-identity -v -p codesigning "$KEYCHAIN"

          printf %s "$APPLE_API_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      # The step above only proves the import did not error. This proves
      # codesign can actually reach the private key without a GUI prompt, which
      # is the part that fails locally without set-key-partition-list.
      - name: Sign a throwaway binary with the imported identity
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cp /bin/echo "$RUNNER_TEMP/probe"
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/probe"
          codesign --verify --strict "$RUNNER_TEMP/probe"
          codesign -dv --verbose=2 "$RUNNER_TEMP/probe"

      - name: Confirm the notarization key is readable
        run: |
          test -s "$RUNNER_TEMP/AuthKey.p8"
          head -1 "$RUNNER_TEMP/AuthKey.p8"
