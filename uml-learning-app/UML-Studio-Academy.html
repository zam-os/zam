veTool:`🖱️ Select / Move`,boxesHeader:`📦 Graphical Elements (Boxes)`,boxesSubhint:`Click or drag an element onto the canvas (or click + on the right):`,edgesHeader:`🔗 Connections (Arrows & Lines)`,edgesSubhint:`Select a connection type and drag from source box to target box:`,toolbarSelect:`🖱️ Select / Move`,toolbarUndo:`↶ Undo`,toolbarRedo:`↷ Redo`,toolbarAutoLayout:`📐 Auto-Layout`,toolbarHint:`Tip: Double-click to rename · Drag the blue dot ● to connect`,studioProjectsHeader:`My Diagram Projects`,studioNewBtn:`+ New`,studioProjectTitle:`Project Title`,studioDiagramType:`UML 2.5.1 Diagram Type (all 14 types)`,studioCoreGroup:`The 6 Core Diagrams`,studioExtraGroup:`Additional 8 UML 2.5.1 Diagrams`,studioJsonExport:`💾 JSON Export`,studioJsonImport:`📂 JSON Import`,studioClearBtn:`Clear`,studioSvgExport:`🖼️ SVG Export`,studioPngExport:`📸 Save PNG Image`,studioCodeHeader:`Text Export (PlantUML / Mermaid)`,studioCopyCodeBtn:`📋 Copy Code to Clipboard`,referenceTitle:`📖 UML 2.5.1 Visual Cheat Sheet & Reference`,referenceSubtitle:`All 14 official OMG UML 2.5.1 diagram types plus key node and relationship rules at a glance.`,referenceSec1:`1. The 14 Official UML 2.5.1 Diagram Types`,referenceSec2:`2. Essential UML 2.5.1 Relationships & Arrow Directions`,structureDiagramTag:`🏛️ Structure Diagram`,behaviorDiagramTag:`⚡ Behavior Diagram`,corePathTag:` · Core Learning Path`,whenToUseLabel:`When to use?`,symbolismLabel:`Notation:`,directionRuleLabel:`🧭 Direction Rule:`,inspectorEmptyTitle:`No Element Selected`,inspectorEmptyDesc:`Click any box or connection on the canvas to edit names, attributes, operations, multiplicities, or arrow directions.`,shortcutDblClick:`Quick Rename`,shortcutPortDrag:`Connect`,shortcutDelete:`Delete Element`,shortcutUndo:`Undo`,inspectorNameLabel:`Name / Label`,inspectorStereoLabel:`Stereotype «...» (optional)`,inspectorStateActsHeader:`Internal State Activities`,inspectorFragmentHeader:`Combined Fragment Operator`,inspectorGuardLabel:`Condition [Guard]`,inspectorAttributesHeader:`Attributes`,inspectorEnumValuesHeader:`Enumeration Literals`,inspectorOperationsHeader:`Operations / Methods`,inspectorAddBtn:`+ Add`,inspectorDeleteNodeBtn:`🗑️ Delete Element`,inspectorDeleteEdgeBtn:`🗑️ Delete Connection`,inspectorFrom:`From:`,inspectorTo:`To:`,inspectorReverseBtn:`Reverse Direction ⇄`,inspectorEdgeKindLabel:`Connection Type (UML 2.5.1)`,inspectorEdgeLabel:`Label / Message / Event`,inspectorEdgeGuard:`Guard Condition [Guard] (without brackets)`,inspectorSrcMult:`Source Multiplicity`,inspectorTgtMult:`Target Multiplicity`,inspectorMultPresets:`Quick Multiplicity:`,celebrationKicker:e=>`STAGE ${e} CELEBRATED & COMPLETED`,celebrationAwardPrefix:`🏆 New Badge Earned:`,celebrationToolboxHeader:`Your New Visual Expression Toolbox:`,celebrationContinueBtn:`Continue on Learning Path 🚀`,zamHeaderBtnLabel:`Consolidate in ZAM`,zamHeaderBtnTitle:`Consolidate knowledge in ZAM & prevent forgetting (Spaced Repetition)`}},t={"use-case":{name:`Use Case Diagram`,shortDescription:`Shows from a user perspective WHO (Actors) wants to achieve WHAT (Use Cases) with a system.`,whenToUse:`Right at the start of an idea: defining the system boundary and the value provided to people and external systems.`},class:{name:`Class Diagram`,shortDescription:`Describes the building blocks of a domain (classes, interfaces), their properties, and their relationships.`,whenToUse:`When modeling domain concepts, data structures, inheritance, and part-whole relationships.`},activity:{name:`Activity Diagram`,shortDescription:`Visualizes workflows, step-by-step processes, decisions, and parallel paths.`,whenToUse:`When you want to understand or explain how a business process or algorithm unfolds step by step.`},"state-machine":{name:`State Machine Diagram`,shortDescription:`Shows all states of an object or system and which events trigger state transitions.`,whenToUse:`When an entity (e.g. Order, SmartLock, Ticket) has a clear lifecycle with allowed and forbidden transitions.`},sequence:{name:`Sequence Diagram`,shortDescription:`Depicts the chronological exchange of messages between lifelines from top to bottom.`,whenToUse:`When tracing the exact interaction across multiple components or objects over time for a scenario.`},component:{name:`Component Diagram`,shortDescription:`Shows modular system building blocks (components), their provided and required interfaces, and dependencies.`,whenToUse:`For high-level system architecture: how modules are cleanly decoupled via interfaces.`},package:{name:`Package Diagram`,shortDescription:`Groups model elements into logical namespaces (packages) and shows their import/dependency structure.`,whenToUse:`To organize layered architectures and top-level module dependencies.`},object:{name:`Object Diagram`,shortDescription:`A snapshot of concrete instances and their attribute values at a specific point in time.`,whenToUse:`To validate an abstract class diagram against a concrete example scenario.`},deployment:{name:`Deployment Diagram`,shortDescription:`Shows physical or virtual runtime infrastructure (servers, containers, devices) and deployed artifacts.`,whenToUse:`When visualizing cloud nodes, servers, databases, and communication protocols.`},"composite-structure":{name:`Composite Structure Diagram`,shortDescription:`Looks inside a class or component: internal parts, ports, and connectors.`,whenToUse:`When the internal wiring of a complex component needs to be shown in detail.`},communication:{name:`Communication Diagram`,shortDescription:`Emphasizes structural links between collaborating objects with numbered messages (1, 1.1, 2).`,whenToUse:`As a compact alternative to a sequence diagram when object topology matters more than the timeline.`},"interaction-overview":{name:`Interaction Overview Diagram`,shortDescription:`Combines an activity diagram with embedded interaction frames (sequence fragments).`,whenToUse:`To show control flow across multiple individual sequence scenarios.`},timing:{name:`Timing Diagram`,shortDescription:`Focuses on exact timing constraints and state changes along a measurable time axis.`,whenToUse:`For real-time systems, hardware protocols, or strict SLA/timeout requirements.`},profile:{name:`Profile Diagram`,shortDescription:`Extends the UML metamodel itself with custom stereotypes («stereotype») and tagged values.`,whenToUse:`When tailoring UML for a specific domain (e.g. medical devices, cloud, automotive).`}},n={actor:{label:`Actor`,shortHint:`Human role or external system outside the system boundary`,meaning:`An Actor (stick figure) represents a role played by a human user or external system interacting with your system. Golden rule: Actors always stand OUTSIDE the system boundary!`,defaultName:`Customer`},"use-case":{label:`Use Case`,shortHint:`Concrete user goal (Verb + Noun, e.g. 'Buy Ticket')`,meaning:`An ellipse describes a complete value-delivering goal the system achieves for an actor — placed INSIDE the system boundary.`,defaultName:`Perform Task`},"system-boundary":{label:`System Boundary`,shortHint:`Frame enclosing all use cases that belong to your system`,meaning:`Separates what is part of the system being built (inside: use cases) from what is outside (actors).`,defaultName:`My System`},class:{label:`Class`,shortHint:`Blueprint for objects with name, attributes, and operations`,meaning:"A rectangle with three compartments: Class name at the top, attributes (`- balance: Euro`) in the middle, and operations (`+ deposit(amount: Euro): void`) at the bottom.",defaultName:`NewClass`},"abstract-class":{label:`Abstract Class`,shortHint:`Superclass that cannot be instantiated directly (italic name)`,meaning:"Bundles shared attributes and methods for subclasses (e.g. `Vehicle` for `Car` and `Bicycle`), rendered with an italic name.",defaultName:`AbstractBase`},interface:{label:`Interface`,shortHint:`Contract of method signatures with «interface» stereotype`,meaning:`Defines WHAT a component must be able to do without prescribing HOW it is implemented internally.`,defaultName:`IService`},enum:{label:`Enumeration`,shortHint:`Fixed set of allowed constants (e.g. OPEN, PAID, CANCELLED)`,meaning:`Defines a closed list of named constants with «enumeration» to prevent ambiguous free-text status values.`,defaultName:`Status`},package:{label:`Package`,shortHint:`Folder container for grouping classes or components logically`,meaning:`Groups related model elements into a dedicated namespace (recognizable by the top-left folder tab).`,defaultName:`coremodule`},object:{label:`Object (Instance)`,shortHint:"Concrete runtime instance formatted as `myCar : Car` (underlined)",meaning:"Shows a concrete runtime instance with actual attribute values, indicated by an underlined header `instanceName : ClassName`.",defaultName:`instance : Class`},"initial-node":{label:`Initial Node`,shortHint:`Filled circle (●): Where the activity workflow begins`,meaning:`Marks the unambiguous entry point of an activity diagram where the control token starts flowing.`,defaultName:`Start`},"activity-final":{label:`Activity Final`,shortHint:`Bullseye (◉): Terminates the entire activity immediately`,meaning:`A filled circle inside a ring (bullseye). When a token reaches it, the entire activity completes.`,defaultName:`End`},"flow-final":{label:`Flow Final`,shortHint:`Circle with X (⊗): Terminates only this parallel branch`,meaning:`Ends only the local control flow branch while other parallel branches continue.`,defaultName:`BranchEnd`},action:{label:`Action`,shortHint:`Rounded rectangle for a single work step (e.g. 'Verify Payment')`,meaning:`An executable work step within an activity, phrased with an active verb.`,defaultName:`Execute Step`},"decision-merge":{label:`Decision / Merge`,shortHint:`Diamond (◇): Branches flow via [Guards] or merges alternative paths`,meaning:"As a Decision, every outgoing edge needs a mutually exclusive guard in square brackets like `[stock > 0]`. As a Merge, it reunites alternative paths.",defaultName:`Condition?`},"fork-join":{label:`Fork / Join Bar`,shortHint:`Thick bar (▬): Splits into parallel flows (Fork) or synchronizes them (Join)`,meaning:`As a Fork, it starts multiple concurrent paths simultaneously. As a Join, it waits until ALL incoming parallel paths finish.`,defaultName:`ParallelBar`},"object-node":{label:`Object Node`,shortHint:`Sharp rectangle for data or documents flowing between actions`,meaning:"Represents data or physical items (e.g. `Invoice [paid]`) produced by one action and consumed by another.",defaultName:`Document`},swimlane:{label:`Swimlane (Partition)`,shortHint:`Column/lane showing WHO is responsible for the actions inside`,meaning:"Organizes activity actions by responsible role or department (e.g. `Customer`, `Warehouse`).",defaultName:`Responsibility`},"initial-state":{label:`Initial State`,shortHint:`Filled dot (●) pointing to the first real state`,meaning:`Marks the state in which an object's lifecycle begins immediately after creation.`,defaultName:`Start`},state:{label:`State`,shortHint:`Rounded rectangle (optionally with entry / do / exit behavior)`,meaning:"Describes a phase in the life of an object (e.g. `Reserved`, `Occupied`) while waiting for events.",defaultName:`Ready`},"final-state":{label:`Final State`,shortHint:`Bullseye (◉): The object's lifecycle is complete`,meaning:`When the object reaches the final state, its state machine terminates.`,defaultName:`End`},"choice-pseudostate":{label:`Choice Pseudostate`,shortHint:`Diamond (◇) in state machines for dynamic branching via [Guard]`,meaning:"Dynamically selects a target state during a transition based on guard conditions `[...] `.",defaultName:`Check`},lifeline:{label:`Lifeline (Participant)`,shortHint:"Header box `:Service` with a vertical dashed timeline below",meaning:"Represents an interaction participant (e.g. `:Cart` or `:PaymentService`). Time flows top-to-bottom along the dashed line.",defaultName:`:Service`},"actor-lifeline":{label:`Actor Lifeline`,shortHint:`Human or external actor with its own vertical timeline`,meaning:`Represents the initiating user or external partner in a sequence diagram with a vertical timeline.`,defaultName:`User`},"combined-fragment":{label:`Combined Fragment`,shortHint:"Frame with operator `alt`, `opt`, `loop`, or `par`",meaning:"Encloses sequence messages that execute conditionally (`opt` / `alt [guard]`), repeatedly (`loop`), or in parallel (`par`).",defaultName:`Conditional Block`},component:{label:`Component`,shortHint:`Modular system unit with «component» and component icon`,meaning:"An encapsulated, replaceable system module (e.g. `AuthService`, `BillingModule`) communicating via explicit interfaces.",defaultName:`ServiceModule`},"provided-interface":{label:`Provided Interface (Lollipop)`,shortHint:`Closed circle on a stick (○—): Interface offered by a component`,meaning:`The lollipop symbol shows at a glance: This component PROVIDES this interface and fulfills its contract.`,defaultName:`API`},"required-interface":{label:`Required Interface (Socket)`,shortHint:`Half-circle socket ()—): Interface required from another component`,meaning:`The socket symbol shows: This component REQUIRES a partner that provides the matching interface.`,defaultName:`DatabaseAPI`},port:{label:`Port`,shortHint:`Small square interaction point on a component boundary`,meaning:"Bundles a named entry/exit endpoint on a component's boundary (e.g. `https:443`).",defaultName:`httpPort`},"deployment-node":{label:`Deployment Node`,shortHint:`3D box for physical devices, servers, or runtime environments`,meaning:"Represents physical hardware (`«device»`) or a software execution environment (`«executionEnvironment»`).",defaultName:`AppServer`},note:{label:`Note / Comment`,shortHint:`Dog-eared sheet for important constraints or explanations`,meaning:`Allows you to attach rationale, invariants, or helpful notes directly to any model element.`,defaultName:`Important note...`}},r={association:{label:`Association`,shortHint:`Solid line (──): General relationship or communication link`,meaning:`Expresses that two elements are linked (e.g. an actor communicates with a use case, or two classes know each other).`,directionRule:`Undirected — connects both partners symmetrically.`},"directed-association":{label:`Directed Association`,shortHint:`Solid line with open arrowhead (──>): A navigates to B`,meaning:`Shows navigability: The source class holds a reference to the target class (A knows B).`,directionRule:`From the referencing source to the referenced target (open arrow).`},aggregation:{label:`Aggregation (Shared Part-Whole)`,shortHint:`Hollow diamond (◇──) at the whole: The part can exist without the whole`,meaning:"A 'has-a' part-whole relationship where parts survive independently if the whole is dissolved (e.g. `Fleet` ◇── `Vehicle`).",directionRule:`IMPORTANT: The hollow diamond ◇ always sits at the WHOLE (source), line leads to the PART (target)!`},composition:{label:`Composition (Existence-Dependent)`,shortHint:`Filled diamond (◆──) at the whole: If the whole dies, the part dies too`,meaning:"Strong part-whole relationship with exclusive existence dependency (e.g. `Order` ◆── `OrderItem` or `House` ◆── `Room`).",directionRule:`IMPORTANT: The filled black diamond ◆ always sits at the WHOLE (source), line leads to the PART (target)!`},generalization:{label:`Inheritance / Generalization`,shortHint:`Solid line with hollow triangle (──▷): 'is-a' relationship`,meaning:"Expresses inheritance: The specific subclass (e.g. `ElectricCar`) inherits all features of the general superclass (`Vehicle`).",directionRule:`From the specific subclass to the general superclass (where the hollow triangle ▷ sits).`},realization:{label:`Interface Realization`,shortHint:`Dashed line with hollow triangle (- - ▷): Class implements «interface»`,meaning:"Shows that a class or component implements the contract defined by an `«interface»`.",directionRule:`From the implementing class/component to the «interface» (where the hollow triangle ▷ sits).`},dependency:{label:`Dependency`,shortHint:`Dashed line with open arrow (- - >): 'uses temporarily'`,meaning:`Element A uses element B (so changes to B may require changes to A).`,directionRule:`From the dependent client (source) to the required provider (open arrow).`},include:{label:`«include» (Mandatory Sub-Step)`,shortHint:`Dashed arrow with «include»: Base use case ALWAYS invokes sub-use-case`,meaning:"A base use case mandatorily includes a shared sub-step every time (e.g. `Unlock Door ──«include»──> Verify Code`).",directionRule:`From the main base use case to the mandatorily included sub-use-case!`},extend:{label:`«extend» (Optional Extension)`,shortHint:`Dashed arrow with «extend»: Optional extension points to the base use case`,meaning:"Optional extra behavior plugs into a base use case under specific conditions (e.g. `Redeem Discount ──«extend»──> Buy Ticket`).",directionRule:`WATCH OUT: From the OPTIONAL extending use case to the base use case (opposite to «include»!).`},"control-flow":{label:`Control Flow / Object Flow`,shortHint:`Directed arrow (──>) between actions, optionally with [Guard]`,meaning:"Passes flow from one step to the next. After a decision diamond, add a guard in brackets like `[payment valid]`.",directionRule:`In chronological order from predecessor step to successor step.`},transition:{label:`State Transition`,shortHint:"Arrow between states labeled `event [guard] / effect`",meaning:`Describes moving from a source state to a target state when triggered by an event.`,directionRule:`From the previous state to the new state.`},"sync-message":{label:`Synchronous Message (Call)`,shortHint:`Solid line with FILLED triangle (──▶): Sender waits for reply`,meaning:`The caller invokes an operation on the receiver and blocks waiting until a reply returns.`,directionRule:`From the calling lifeline to the called lifeline.`},"async-message":{label:`Asynchronous Message (Signal)`,shortHint:`Solid line with OPEN arrow (──>): Sender continues immediately`,meaning:`The sender dispatches an event or signal without waiting for a direct response.`,directionRule:`From sender to receiver.`},"return-message":{label:`Reply / Return Message`,shortHint:`Dashed line with open arrow (- - >): Return value back to caller`,meaning:`Delivers the result of a synchronous call back to the waiting caller lifeline.`,directionRule:`From the called service back to the original caller.`},"assembly-connector":{label:`Assembly Connector`,shortHint:`Wires a required interface (Socket) to a provided interface (Lollipop)`,meaning:`Connects two components so the interface requirement of one is satisfied by the other.`,directionRule:`From the requiring consumer to the providing supplier.`},"note-link":{label:`Note Link`,shortHint:`Dashed line without arrowhead between a Note and an element`,meaning:`Attaches a comment note to the element it explains.`,directionRule:`Between Note and any element.`}},i={"use-case":{type:`use-case`,name:`Anwendungsfalldiagramm`,englishName:`Use Case Diagram`,category:`behavior`,isCoreLearningPath:!0,icon:`🎭`,shortDescription:`Zeigt aus Nutzersicht, WER (Akteure) WAS (Anwendungsfälle) mit einem System erreichen möchte.`,whenToUse:`Ganz am Anfang einer Idee: Systemgrenze abstecken und den Nutzen für Menschen und Nachbarsysteme klären.`,recommendedNodes:[`actor`,`use-case`,`system-boundary`,`note`],recommendedEdges:[`association`,`include`,`extend`,`generalization`,`note-link`]},class:{type:`class`,name:`Klassendiagramm`,englishName:`Class Diagram`,category:`structure`,isCoreLearningPath:!0,icon:`🏛️`,shortDescription:`Beschreibt die Bausteine einer Domäne (Klassen, Schnittstellen), ihre Eigenschaften und ihre Beziehungen.`,whenToUse:`Wenn du die Begriffe deines Systems, ihre Datenstruktur und Zusammenhänge wie Teil-Ganzes oder Vererbung modellierst.`,recommendedNodes:[`class`,`abstract-class`,`interface`,`enum`,`package`,`note`],recommendedEdges:[`association`,`directed-association`,`aggregation`,`composition`,`generalization`,`realization`,`dependency`,`note-link`]},activity:{type:`activity`,name:`Aktivitätsdiagramm`,englishName:`Activity Diagram`,category:`behavior`,isCoreLearningPath:!0,icon:`⚡`,shortDescription:`Visualisiert Abläufe, Schritt-für-Schritt-Prozesse, Entscheidungen und parallele Pfade.`,whenToUse:`Wenn du verstehen oder erklären willst, wie ein Geschäftsprozess oder Algorithmus Schritt für Schritt abläuft.`,recommendedNodes:[`initial-node`,`action`,`decision-merge`,`fork-join`,`object-node`,`activity-final`,`flow-final`,`swimlane`,`note`],recommendedEdges:[`control-flow`,`note-link`]},"state-machine":{type:`state-machine`,name:`Zustandsdiagramm`,englishName:`State Machine Diagram`,category:`behavior`,isCoreLearningPath:!0,icon:`🔄`,shortDescription:`Zeigt alle Zustände eines Objekts oder Systems und welche Ereignisse Zustandswechsel auslösen.`,whenToUse:`Wenn ein Ding (z. B. Bestellung, Türschloss, Ticket) einen klaren Lebenszyklus mit erlaubten und verbotenen Übergängen hat.`,recommendedNodes:[`initial-state`,`state`,`choice-pseudostate`,`final-state`,`note`],recommendedEdges:[`transition`,`note-link`]},sequence:{type:`sequence`,name:`Sequenzdiagramm`,englishName:`Sequence Diagram`,category:`behavior`,isCoreLearningPath:!0,icon:`⏱️`,shortDescription:`Stellt den zeitlichen Nachrichtenaustausch zwischen Lebenslinien von oben nach unten dar.`,whenToUse:`Wenn du das exakte Zusammenspiel mehrerer Komponenten oder Objekte über die Zeit für ein Szenario nachvollziehen willst.`,recommendedNodes:[`actor-lifeline`,`lifeline`,`combined-fragment`,`note`],recommendedEdges:[`sync-message`,`async-message`,`return-message`,`note-link`]},component:{type:`component`,name:`Komponentendiagramm`,englishName:`Component Diagram`,category:`structure`,isCoreLearningPath:!0,icon:`🧩`,shortDescription:`Zeigt modulare Systembausteine (Komponenten), ihre angebotenen und benötigten Schnittstellen sowie Abhängigkeiten.`,whenToUse:`Für die Systemarchitektur im Großen: Wie werden Module sauber über Schnittstellen entkoppelt?`,recommendedNodes:[`component`,`provided-interface`,`required-interface`,`port`,`package`,`note`],recommendedEdges:[`assembly-connector`,`dependency`,`realization`,`directed-association`,`note-link`]},package:{type:`package`,name:`Paketdiagramm`,englishName:`Package Diagram`,category:`structure`,isCoreLearningPath:!1,icon:`📦`,shortDescription:`Gruppiert Modellelemente in logische Namensräume (Pakete) und zeigt deren Import-/Abhängigkeitsstruktur.`,whenToUse:`Um Schichtenarchitekturen und Modul-Abhängigkeiten auf oberster Ebene zu ordnen.`,recommendedNodes:[`package`,`class`,`component`,`note`],recommendedEdges:[`dependency`,`note-link`]},object:{type:`object`,name:`Objektdiagramm`,englishName:`Object Diagram`,category:`structure`,isCoreLearningPath:!1,icon:`📸`,shortDescription:`Eine Momentaufnahme (Snapshot) konkreter Instanzen und ihrer Attributwerte zu einem bestimmten Zeitpunkt.`,whenToUse:`Um ein abstraktes Klassendiagramm anhand eines konkreten Beispielszenarios zu überprüfen.`,recommendedNodes:[`object`,`note`],recommendedEdges:[`association`,`directed-association`,`note-link`]},deployment:{type:`deployment`,name:`Verteilungsdiagramm`,englishName:`Deployment Diagram`,category:`structure`,isCoreLearningPath:!1,icon:`🖥️`,shortDescription:`Zeigt die physische oder virtuelle Laufzeit-Infrastruktur (Server, Container, Geräte) und die darauf verteilten Artefakte.`,whenToUse:`Wenn du Cloud-Knoten, Server, Datenbanken und Kommunikationsprotokolle visualisierst.`,recommendedNodes:[`deployment-node`,`component`,`note`],recommendedEdges:[`association`,`dependency`,`note-link`]},"composite-structure":{type:`composite-structure`,name:`Kompositionsstrukturdiagramm`,englishName:`Composite Structure Diagram`,category:`structure`,isCoreLearningPath:!1,icon:`🔬`,shortDescription:`Blickt in das Innere einer Klasse oder Komponente: Teile (Parts), Ports und innere Konnektoren.`,whenToUse:`Wenn das innere Zusammenspiel eines komplexen Bausteins detailliert gezeigt werden soll.`,recommendedNodes:[`component`,`port`,`class`,`note`],recommendedEdges:[`association`,`assembly-connector`,`note-link`]},communication:{type:`communication`,name:`Kommunikationsdiagramm`,englishName:`Communication Diagram`,category:`behavior`,isCoreLearningPath:!1,icon:`🕸️`,shortDescription:`Betont die strukturellen Verbindungen zwischen zusammenarbeitenden Objekten mit durchnummerierten Nachrichten (1, 1.1, 2).`,whenToUse:`Als kompakte Alternative zum Sequenzdiagramm, wenn das Beziehungsnetz wichtiger ist als die Zeitachse.`,recommendedNodes:[`object`,`actor`,`note`],recommendedEdges:[`directed-association`,`sync-message`,`note-link`]},"interaction-overview":{type:`interaction-overview`,name:`Interaktionsübersichtsdiagramm`,englishName:`Interaction Overview Diagram`,category:`behavior`,isCoreLearningPath:!1,icon:`🗺️`,shortDescription:`Kombiniert ein Aktivitätsdiagramm mit eingebetteten Interaktions-Rahmen (Sequenzfragmenten).`,whenToUse:`Um den Kontrollfluss zwischen mehreren einzelnen Sequenz-Szenarien darzustellen.`,recommendedNodes:[`initial-node`,`action`,`decision-merge`,`combined-fragment`,`activity-final`,`note`],recommendedEdges:[`control-flow`,`note-link`]},timing:{type:`timing`,name:`Zeitverlaufsdiagramm`,englishName:`Timing Diagram`,category:`behavior`,isCoreLearningPath:!1,icon:`📈`,shortDescription:`Fokussiert auf exakte Zeitbedingungen und Zustandswechsel entlang einer messbaren Zeitachse.`,whenToUse:`Bei Echtzeitsystemen, Hardware-Protokollen oder strikten SLA-/Timeout-Anforderungen.`,recommendedNodes:[`state`,`lifeline`,`note`],recommendedEdges:[`transition`,`async-message`,`note-link`]},profile:{type:`profile`,name:`Profildiagramm`,englishName:`Profile Diagram`,category:`structure`,isCoreLearningPath:!1,icon:`🏷️`,shortDescription:`Erweitert das UML-Metamodell selbst durch eigene Stereotypen («stereotype») und Eigenschaftswerte (Tagged Values).`,whenToUse:`Wenn du UML für eine spezielle Domäne (z. B. Medizintechnik, Cloud, Automotive) maßschneiderst.`,recommendedNodes:[`class`,`package`,`note`],recommendedEdges:[`generalization`,`dependency`,`note-link`]}},a={actor:{kind:`actor`,label:`Akteur`,umlTerm:`Actor`,diagramTypes:[`use-case`,`communication`],defaultWidth:90,defaultHeight:110,shortHint:`Menschliche Rolle oder externes System außerhalb der Systemgrenze`,meaning:`Ein Akteur (Strichmännchen) repräsentiert eine Rolle, die ein Mensch oder ein externes System einnimmt, wenn es mit deinem System interagiert. Wichtig: Akteure stehen immer AUSSERHALB der Systemgrenze!`},"use-case":{kind:`use-case`,label:`Anwendungsfall`,umlTerm:`Use Case`,diagramTypes:[`use-case`],defaultWidth:170,defaultHeight:74,shortHint:`Ein konkretes Ziel aus Nutzersicht (Substantiv + Verb, z. B. „Ticket buchen“)`,meaning:`Eine Ellipse beschreibt einen abgeschlossenen Mehrwert, den das System für einen Akteur liefert – kein technisches Detail, sondern ein sichtbares Ergebnis wie „Geld abheben“ oder „Bestellung aufgeben“.`},"system-boundary":{kind:`system-boundary`,label:`Systemgrenze`,umlTerm:`System Boundary (Subject)`,diagramTypes:[`use-case`],defaultWidth:360,defaultHeight:300,isContainer:!0,defaultStereotype:`system`,shortHint:`Rahmen um alle Anwendungsfälle, die zu deinem System gehören`,meaning:`Die Systemgrenze trennt klar, was Teil deines zu bauenden Systems ist (innen: die Anwendungsfälle) und was außerhalb liegt (außen: die Akteure). Das schafft sofort Klarheit über den Projektumfang.`},class:{kind:`class`,label:`Klasse`,umlTerm:`Class`,diagramTypes:[`class`,`package`,`composite-structure`,`profile`],defaultWidth:190,defaultHeight:126,shortHint:`Bauplan für gleichartige Objekte mit Namen, Attributen und Operationen`,meaning:"Das Herzstück der Strukturmodellierung: Ein Rechteck mit drei Abteilen (Kompartimenten). Oben der Klassenname im Singular (z. B. `Konto`), in der Mitte die Attribute (`- saldo: Euro`) und unten die Operationen (`+ einzahlen(betrag: Euro): void`)."},"abstract-class":{kind:`abstract-class`,label:`Abstrakte Klasse`,umlTerm:`Abstract Class`,diagramTypes:[`class`],defaultWidth:190,defaultHeight:120,defaultStereotype:`abstract`,shortHint:`Oberbegriff, von dem keine direkten Instanzen erzeugt werden können (Name kursiv)`,meaning:"Eine abstrakte Klasse bündelt gemeinsame Attribute und Methoden für Unterklassen (z. B. `Fahrzeug` für `Auto` und `Fahrrad`), kann aber selbst nicht direkt instanziiert werden. In UML 2.5.1 wird ihr Name kursiv dargestellt."},interface:{kind:`interface`,label:`Schnittstelle`,umlTerm:`Interface («interface»)`,diagramTypes:[`class`,`component`],defaultWidth:190,defaultHeight:110,defaultStereotype:`interface`,shortHint:`Vertrag aus Methodensignaturen mit Stereotyp «interface»`,meaning:`Eine Schnittstelle legt fest, WAS ein Baustein können muss (Methodenvertrag), ohne vorzuschreiben, WIE er es intern umsetzt. Klassen realisieren sie über einen gestrichelten Vererbungspfeil.`},enum:{kind:`enum`,label:`Aufzählung`,umlTerm:`Enumeration («enumeration»)`,diagramTypes:[`class`],defaultWidth:165,defaultHeight:110,defaultStereotype:`enumeration`,shortHint:`Feste Menge erlaubter Werte (z. B. Status: OFFEN, BEZAHLT, STORNIERT)`,meaning:`Eine Enumeration definiert eine abgeschlossene Liste benannter Konstanten. Damit verhinderst du unklare Freitext-Zustände in deinem Modell.`},package:{kind:`package`,label:`Paket`,umlTerm:`Package`,diagramTypes:[`package`,`class`,`component`,`profile`],defaultWidth:280,defaultHeight:200,isContainer:!0,shortHint:`Ordner-Symbol zur logischen Gruppierung von Klassen oder Komponenten`,meaning:`Ein Paket fasst zusammengehörige Modellelemente in einem eigenen Namensraum zusammen (erkennbar am kleinen Reiter oben links).`},object:{kind:`object`,label:`Objekt (Instanz)`,umlTerm:`InstanceSpecification`,diagramTypes:[`object`,`communication`],defaultWidth:180,defaultHeight:96,shortHint:"Konkrete Instanz im Format `meinAuto : Auto` (unterstrichen)",meaning:"Während eine Klasse der allgemeine Bauplan ist, zeigt ein Objekt-Knoten ein konkretes Exemplar zur Laufzeit mit echten Attributwerten. Erkennbar am unterstrichenen Text `instanzname : Klassenname`."},"initial-node":{kind:`initial-node`,label:`Startknoten`,umlTerm:`Initial Node`,diagramTypes:[`activity`,`interaction-overview`],defaultWidth:36,defaultHeight:36,shortHint:`Ausgefüllter Kreis (●): Hier beginnt der Ablauf der Aktivität`,meaning:`Der ausgefüllte schwarze Punkt markiert den eindeutigen Einstiegspunkt eines Aktivitätsdiagramms. Sobald die Aktivität startet, fließt von hier ein Kontroll-Token los.`},"activity-final":{kind:`activity-final`,label:`Aktivitätsende`,umlTerm:`Activity Final Node`,diagramTypes:[`activity`,`interaction-overview`],defaultWidth:40,defaultHeight:40,shortHint:`Bullauge (◉): Beendet die gesamte Aktivität sofort`,meaning:`Ein ausgefüllter Punkt mit einem äußeren Ring (Bullauge). Erreicht ein Pfad diesen Knoten, wird die gesamte Aktivität abgeschlossen.`},"flow-final":{kind:`flow-final`,label:`Flussende`,umlTerm:`Flow Final Node`,diagramTypes:[`activity`],defaultWidth:38,defaultHeight:38,shortHint:`Kreis mit Kreuz (⊗): Beendet nur diesen einzelnen parallelen Zweig`,meaning:`Beendet nur den lokalen Kontrollfluss-Zweig, während andere parallele Zweige der Aktivität weiterlaufen dürfen.`},action:{kind:`action`,label:`Aktion`,umlTerm:`Action`,diagramTypes:[`activity`,`interaction-overview`],defaultWidth:165,defaultHeight:64,shortHint:`Abgerundetes Rechteck für einen konkreten Arbeitsschritt (z. B. „Zahlung prüfen“)`,meaning:`Eine Aktion ist ein einzelner, ausführbarer Arbeitsschritt innerhalb einer Aktivität. Sie wird als abgerundetes Rechteck mit einer aktiven Verb-Formulierung dargestellt.`},"decision-merge":{kind:`decision-merge`,label:`Entscheidung / Zusammenführung`,umlTerm:`Decision / Merge Node`,diagramTypes:[`activity`,`interaction-overview`],defaultWidth:68,defaultHeight:68,shortHint:`Raute (◇): Verzweigt den Ablauf anhand von [Bedingungen] oder führt Pfade zusammen`,meaning:"Eine Raute mit einer eingehenden und mehreren ausgehenden Kanten ist eine Entscheidung (Decision): Jede ausgehende Kante braucht eine Wächterbedingung in eckigen Klammern wie `[Lagerbestand > 0]`. Mit mehreren eingehenden und einer ausgehenden Kante führt sie alternative Pfade wieder zusammen (Merge)."},"fork-join":{kind:`fork-join`,label:`Parallelisierung (Fork / Join)`,umlTerm:`Fork / Join Node`,diagramTypes:[`activity`],defaultWidth:140,defaultHeight:16,shortHint:`Starker Balken (▬): Startet parallele Abläufe (Fork) oder synchronisiert sie (Join)`,meaning:`Ein dicker schwarzer Balken: Als Fork spaltet er einen Ablauf in mehrere gleichzeitig (nebenläufig) ablaufende Pfade auf. Als Join wartet er, bis ALLE eingehenden parallelen Pfade fertig sind, bevor es weitergeht.`},"object-node":{kind:`object-node`,label:`Objektknoten`,umlTerm:`Object Node`,diagramTypes:[`activity`],defaultWidth:145,defaultHeight:56,shortHint:`Kantiges Rechteck für Daten/Dokumente, die zwischen Aktionen fließen`,meaning:"Im Gegensatz zur abgerundeten Aktion ist ein Objektknoten ein scharfkantiges Rechteck: Er zeigt Daten oder physische Dinge (z. B. `Rechnung [bezahlt]`), die von einer Aktion erzeugt und von einer anderen verarbeitet werden."},swimlane:{kind:`swimlane`,label:`Schwimmbahn (Partition)`,umlTerm:`Activity Partition`,diagramTypes:[`activity`],defaultWidth:260,defaultHeight:360,isContainer:!0,shortHint:`Spalte/Bereich, der zeigt, WER für die darin liegenden Aktionen verantwortlich ist`,meaning:"Eine Aktivitätspartition (Swimlane) gliedert die Schritte eines Prozesses nach Verantwortlichkeiten (z. B. `Kunde`, `Onlineshop`, `Versandlager`)."},"initial-state":{kind:`initial-state`,label:`Startzustand`,umlTerm:`Initial Pseudostate`,diagramTypes:[`state-machine`],defaultWidth:36,defaultHeight:36,shortHint:`Ausgefüllter Punkt (●), der auf den ersten echten Zustand zeigt`,meaning:`Der Start-Pseudozustand markiert, in welchem Zustand der Lebenszyklus eines Objekts direkt nach seiner Erzeugung beginnt.`},state:{kind:`state`,label:`Zustand`,umlTerm:`State`,diagramTypes:[`state-machine`,`timing`],defaultWidth:175,defaultHeight:96,shortHint:`Abgerundetes Rechteck (optional mit entry / do / exit Verhalten)`,meaning:"Ein Zustand beschreibt eine Phase im Leben eines Objekts (z. B. `Reserviert`, `In Zustellung`), in der es auf bestimmte Ereignisse wartet oder eine Aktivität ausführt (`entry /`, `do /`, `exit /`)."},"final-state":{kind:`final-state`,label:`Endzustand`,umlTerm:`Final State`,diagramTypes:[`state-machine`],defaultWidth:40,defaultHeight:40,shortHint:`Bullauge (◉): Der Lebenszyklus des Objekts ist hier abgeschlossen`,meaning:`Erreicht das Objekt den Endzustand (Bullauge), ist sein Zustandsautomat beendet – es finden keine weiteren Zustandsübergänge mehr statt.`},"choice-pseudostate":{kind:`choice-pseudostate`,label:`Entscheidungs-Pseudozustand`,umlTerm:`Choice Pseudostate`,diagramTypes:[`state-machine`],defaultWidth:60,defaultHeight:60,shortHint:`Raute (◇) im Zustandsdiagramm für dynamische Verzweigungen per [Guard]`,meaning:"Wählt während einer Transition anhand von Wächterbedingungen `[...]` dynamisch aus, in welchen Zielzustand gewechselt wird."},lifeline:{kind:`lifeline`,label:`Lebenslinie (Teilnehmer)`,umlTerm:`Lifeline`,diagramTypes:[`sequence`,`timing`],defaultWidth:140,defaultHeight:320,shortHint:"Kopfbox `:Komponente` mit gestrichelter vertikaler Zeitlinie nach unten",meaning:"Eine Lebenslinie repräsentiert einen einzelnen Interaktionsteilnehmer (z. B. `:Warenkorb` oder `:Zahlungsdienst`). Die Zeit läuft entlang der gestrichelten Linie von oben nach unten."},"actor-lifeline":{kind:`actor-lifeline`,label:`Akteur-Lebenslinie`,umlTerm:`Actor Lifeline`,diagramTypes:[`sequence`],defaultWidth:120,defaultHeight:320,shortHint:`Menschlicher oder externer Akteur mit eigener zeitlicher Lebenslinie`,meaning:`Stellt den auslösenden Nutzer oder externen Partner am linken Rand eines Sequenzdiagramms mit einer vertikalen Zeitachse dar.`},"combined-fragment":{kind:`combined-fragment`,label:`Kombiniertes Fragment`,umlTerm:`Combined Fragment (alt / loop / opt)`,diagramTypes:[`sequence`,`interaction-overview`],defaultWidth:380,defaultHeight:160,isContainer:!0,shortHint:"Rahmen mit Operator `alt`, `opt`, `loop` oder `par` für Bedingungen & Schleifen",meaning:"Rahmt Nachrichten im Sequenzdiagramm ein, die nur unter einer Bedingung (`opt` / `alt [Bedingung]`), wiederholt (`loop`) oder parallel (`par`) ausgeführt werden."},component:{kind:`component`,label:`Komponente`,umlTerm:`Component («component»)`,diagramTypes:[`component`,`deployment`,`composite-structure`,`package`],defaultWidth:195,defaultHeight:96,defaultStereotype:`component`,shortHint:`Austauschbarer Systembaustein mit «component» und Komponenten-Symbol`,meaning:"Eine Komponente ist ein gekapselter, austauschbarer Teil eines Systems (z. B. `AuthService`, `RechnungsModul`), der nach außen nur über klar definierte Schnittstellen kommuniziert."},"provided-interface":{kind:`provided-interface`,label:`Angebotene Schnittstelle (Lollipop)`,umlTerm:`Provided Interface`,diagramTypes:[`component`],defaultWidth:120,defaultHeight:54,shortHint:`Geschlossener Kreis am Stiel (○—): Diese Schnittstelle stellt die Komponente bereit`,meaning:`Die Lollipop-Notation (Kreis) zeigt auf einen Blick: Diese Komponente BIETET diese Schnittstelle an und erfüllt ihren Vertrag.`},"required-interface":{kind:`required-interface`,label:`Benötigte Schnittstelle (Socket)`,umlTerm:`Required Interface`,diagramTypes:[`component`],defaultWidth:120,defaultHeight:54,shortHint:`Halbkreis-Greifer ()—): Diese Schnittstelle benötigt die Komponente von außen`,meaning:`Die Socket-Notation (offene Schale) zeigt: Diese Komponente BENÖTIGT einen Partner, der die passende Schnittstelle anbietet.`},port:{kind:`port`,label:`Port`,umlTerm:`Port`,diagramTypes:[`component`,`composite-structure`],defaultWidth:44,defaultHeight:44,shortHint:`Kleines Quadrat als dedizierter Interaktionspunkt einer Komponente`,meaning:"Ein Port bündelt einen benannten Ein-/Ausgangspunkt am Rand einer Komponente (z. B. `https:443` oder `eventBus`)."},"deployment-node":{kind:`deployment-node`,label:`Laufzeit-Knoten (Node)`,umlTerm:`Deployment Node`,diagramTypes:[`deployment`],defaultWidth:220,defaultHeight:130,isContainer:!0,defaultStereotype:`device`,shortHint:`3D-Box für physische Geräte, Server oder Laufzeitumgebungen`,meaning:"Repräsentiert eine physische Hardware (`«device»`) oder Software-Laufzeitumgebung (`«executionEnvironment»` wie Docker/JVM), auf der Komponenten laufen."},note:{kind:`note`,label:`Notiz / Kommentar`,umlTerm:`Comment (Note)`,diagramTypes:[`use-case`,`class`,`activity`,`state-machine`,`sequence`,`component`,`package`,`object`,`deployment`,`composite-structure`,`communication`,`interaction-overview`,`timing`,`profile`],defaultWidth:170,defaultHeight:76,shortHint:`Blatt mit Eselsohr für wichtige Randbedingungen oder Erklärungen`,meaning:`Eine UML-Notiz (Rechteck mit umgeknickter Ecke oben rechts) erlaubt dir, wichtige Gedanken, Invarianten oder Warum-Erklärungen direkt an jedes beliebige Element zu heften.`}},o={association:{kind:`association`,label:`Assoziation`,umlTerm:`Association`,diagramTypes:[`use-case`,`class`,`object`,`deployment`],lineStyle:`solid`,sourceMarker:`none`,targetMarker:`none`,shortHint:`Durchgezogene Linie (──): Allgemeine Beziehung oder Kommunikation`,meaning:"Drückt aus, dass zwei Elemente miteinander in Verbindung stehen (z. B. ein Akteur kommuniziert mit einem Anwendungsfall, oder zwei Klassen kennen einander). An den Enden können Multiplizitäten (`1`, `0..*`) stehen.",directionRule:`Ungerichtet – verbindet beide Partner gleichberechtigt.`},"directed-association":{kind:`directed-association`,label:`Gerichtete Assoziation`,umlTerm:`Directed Association (Navigable)`,diagramTypes:[`class`,`object`,`component`,`communication`],lineStyle:`solid`,sourceMarker:`none`,targetMarker:`open-arrow`,shortHint:`Durchgezogene Linie mit offe
